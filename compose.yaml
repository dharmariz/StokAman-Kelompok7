services:
  app:
    build:
      context: .
      target: production
    container_name: stokaman-app
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stokaman-net

  db:
    image: mysql:8.0
    container_name: stokaman-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - stokaman-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stokaman-net

volumes:
  stokaman-db-data:

networks:
  stokaman-net:
    driver: bridge